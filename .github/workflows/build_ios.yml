name: Build AudioWin Mobile IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Swift Package for iOS
        run: |
          cd audiowinmobile
          # Generate Xcode project from Swift Package
          swift package generate-xcodeproj --output AudioWinMobile.xcodeproj || true
          
          # Build Release for iOS Device (Generic arm64)
          xcodebuild -scheme AudioWinMobile \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="../build" \
            clean build

      - name: Package .IPA file
        run: |
          mkdir -p Payload
          # Locate built .app bundle
          APP_PATH=$(find build -name "AudioWinMobile.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          echo "Using App Bundle: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r AudioWinMobile.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioWinMobile-IPA
          path: AudioWinMobile.ipa
          retention-days: 14
